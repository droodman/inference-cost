<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inference Cost Plot Viewer</title>
    <style>
      :root {
        --bg: #f5f5f3;
        --panel: #ffffff;
        --text: #1d1d1d;
        --muted: #5e5e5e;
        --border: #d9d9d5;
        --accent: #2c5d9a;
        --missing: #a22020;
      }

      * { box-sizing: border-box; }

      body {
        margin: 20px;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Arial, sans-serif;
      }

      h1 {
        margin: 0 0 16px 0;
        font-size: 1.5em;
        font-weight: 700;
      }

      .layout {
        display: flex;
        gap: 20px;
        align-items: flex-start;
      }

      .controls {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 220px;
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
        position: sticky;
        top: 20px;
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .group-label {
        font-size: 0.8em;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .control-group label {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        font-size: 0.96em;
        color: var(--text);
      }

      .control-group input[type="radio"] {
        margin: 0;
      }

      .plot-container {
        flex: 1;
        min-width: 0;
      }

      .plot-frame {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 600px;
      }

      #plot {
        display: block;
        max-width: 80%;
        width: 80%;
        height: auto;
        background: #fff;
      }

      .filename {
        margin-top: 8px;
        font-size: 0.86em;
        color: var(--muted);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      }

      .missing {
        color: var(--missing);
        font-style: italic;
        padding: 12px 0;
      }

      @media (max-width: 900px) {
        .layout {
          flex-direction: column;
        }

        .controls {
          position: static;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <h1>Inference Cost Plot Viewer</h1>

    <div class="layout">
      <div class="controls">
        <div class="control-group">
          <div class="group-label">Model</div>
          <label><input type="radio" name="model" value="A" checked /> A</label>
          <label><input type="radio" name="model" value="B" /> B</label>
          <label><input type="radio" name="model" value="S" /> S</label>
          <label><input type="radio" name="model" value="envelope" /> Envelope</label>
        </div>

        <div class="control-group">
          <div class="group-label">Order</div>
          <label><input type="radio" name="order" value="lin" checked /> Linear</label>
          <label><input type="radio" name="order" value="quad" /> Quadratic</label>
        </div>

        <div class="control-group">
          <div class="group-label">Display</div>
          <label><input type="radio" name="plotType" value="frontier" checked /> Frontier progression</label>
          <label><input type="radio" name="plotType" value="isocost" /> Isocost</label>
        </div>
      </div>

      <div class="plot-container">
        <div class="plot-frame">
          <img id="plot" src="" alt="Selected plot" />
        </div>
        <div class="filename" id="filename"></div>
      </div>
    </div>

    <script>
      function getRadioValue(name) {
        const checked = document.querySelector(`input[name="${name}"]:checked`);
        return checked ? checked.value : "";
      }

      function buildFilename() {
        const model = getRadioValue("model");
        const order = getRadioValue("order");
        const plotType = getRadioValue("plotType");

        if (model === "envelope") {
          if (plotType === "frontier") {
            return `envelope_${order}.png`;
          }
          return `isocost_envelope_${order}.png`;
        }

        if (plotType === "frontier") {
          return `frontier_progression_${model}_${order}.png`;
        }

        return `isocost_${model}_${order}.png`;
      }

      function update() {
        const filename = buildFilename();
        const img = document.getElementById("plot");
        const label = document.getElementById("filename");
        const src = `../output/${filename}`;
        img.style.width = "80%";
        img.style.maxWidth = "80%";

        img.onerror = function () {
          img.style.display = "none";
          label.innerHTML = `<span class="missing">File not found: ${filename}</span>`;
        };

        img.onload = function () {
          img.style.display = "block";
          label.textContent = filename;
        };

        img.src = src;
      }

      document.querySelectorAll('input[type="radio"]').forEach((radio) => {
        radio.addEventListener("change", update);
      });

      update();
    </script>
  </body>
</html>
