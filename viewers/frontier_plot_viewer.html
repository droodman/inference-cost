<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inference Cost Plot Viewer</title>
    <style>
      /* One background for the whole page: white is SURFACE in
         frontier_viz.R (the Epoch AI house style, on a white surface), the
         colour the PNGs themselves are painted on, so the plots sit on the
         page with no visible seam and no framing chrome. Text and muted ink
         are the guide's tick-text greys; "missing" is the house pink. If DARK
         is turned on there, use --bg #101014, --text #f2f1ec, --muted #8f8e88,
         --missing #ff8f85 here. */
      :root {
        --bg: #FFFFFF;
        --text: #212A2A;
        --muted: #536565;
        --missing: #E03D90;
      }

      * { box-sizing: border-box; }

      body {
        margin: 10px 12px;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Arial, sans-serif;
      }

      h1 {
        margin: 0 0 10px 0;
        font-size: 1.25em;
        font-weight: 700;
      }

      .layout {
        display: flex;
        gap: 14px;
        align-items: flex-start;
      }

      /* Fixed width, not min-width: a flex item's automatic minimum is its
         CONTENT width, so with min-width the longest Model label set the
         column's width and refused to wrap. Pinning the width is what makes
         long labels wrap instead of widening the selector. */
      .controls {
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: 180px;
        flex-shrink: 0;
        position: sticky;
        top: 10px;
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .group-label {
        font-size: 0.8em;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      /* flex-start, not center: with wrapped two-line labels the radio should
         sit beside the first line, not float between them */
      .control-group label {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        cursor: pointer;
        font-size: 0.9em;
        line-height: 1.25;
        color: var(--text);
      }

      .control-group input[type="radio"] {
        margin: 2px 0 0 0;
        flex-shrink: 0;
      }

      .plot-container {
        flex: 1;
        min-width: 0;
      }

      /* Full width of the remaining space, but never past the PNG's native
         2000px (10in at 200dpi) -- upscaling would blur exactly the legibility
         this layout is buying. */
      #plot {
        display: block;
        width: 100%;
        max-width: 2000px;
        height: auto;
      }

      /* The 3-D pages are htmlwidgets (WebGL) and render in an iframe of
         fixed height, like the table viewer's; the 2-D <img> and this iframe
         swap visibility on the Rendering toggle. */
      #plot3d {
        display: none;
        width: 100%;
        height: 86vh;
        min-height: 600px;
        border: 0;
        background: var(--bg);
      }

      .filename {
        margin-top: 4px;
        font-size: 0.86em;
        color: var(--muted);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      }

      .missing {
        color: var(--missing);
        font-style: italic;
        padding: 12px 0;
      }

      @media (max-width: 900px) {
        .layout {
          flex-direction: column;
        }

        .controls {
          position: static;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <h1>Inference Cost Plot Viewer</h1>

    <div class="layout">
      <div class="controls">
        <!-- Which variable the fit models directly. The cost direction shows
             the DUAL of each accuracy-direction model (plot_cost_frontier.R):
             same frontier object where one exists, misfit priced in log
             dollars instead of logits. Model labels swap to the duals' names;
             all three orders exist in both directions. -->
        <div class="control-group">
          <div class="group-label">Modeled variable</div>
          <label><input type="radio" name="direction" value="acc" checked /> Accuracy</label>
          <label><input type="radio" name="direction" value="cost" /> Cost</label>
        </div>

        <!-- The symmetric twin of Modeled variable: which variable the figure
             PLOTS as the outcome, and against what. Writing a fit as the
             surface z(cost, date), there are four 2-D readings of it, and
             every model is drawn in all four:

               accuracy vs cost,     curves by date        isochrones
               cost     vs date,     contours by accuracy  iso-accuracy
               accuracy vs date,     contours by cost      isocost

             Transposing the first -- cost up, accuracy across -- would be the
             same curves remapped and is deliberately not offered; the two
             contour plates each hold a DIFFERENT variable fixed, so neither
             is redundant. Either modeled variable can be shown any of the
             three ways -- native in some, inverted in others. The fourth option
             plots the rate of cost decline at fixed accuracy over
             (accuracy, date) -- 3-D only, Pareto-grid models only. -->
        <div class="control-group">
          <div class="group-label">Plotted variable</div>
          <label><input type="radio" name="plotType" value="frontier" checked /> Accuracy vs cost (isochrones)</label>
          <label><input type="radio" name="plotType" value="isocost" /> Accuracy vs date (isocost)</label>
          <label><input type="radio" name="plotType" value="isoaccuracy" /> Cost vs date (iso-accuracy)</label>
          <label><input type="radio" name="plotType" value="decline" /> Cost decline rate (%/qtr)</label>
        </div>

        <div class="control-group">
          <div class="group-label">Model</div>
          <label><input type="radio" name="model" value="paretologit" checked autocomplete="off"/> <span data-acc="Logistic, Pareto points" data-cost="Least squares, Pareto grid">Logistic, Pareto points</span></label>
          <label><input type="radio" name="model" value="paretologitenv" /> <span data-acc="Logistic, Pareto points, envelope-constrained" data-cost="Least squares, Pareto grid, envelope-constrained">Logistic, Pareto points, envelope-constrained</span></label>
          <label><input type="radio" name="model" value="S" /> <span data-acc="Logistic, all points" data-cost="Least squares, all points">Logistic, all points</span></label>
          <label><input type="radio" name="model" value="A"/> <span data-acc="Stochastic frontier" data-cost="Stochastic cost frontier">Stochastic frontier</span></label>
          <label><input type="radio" name="model" value="B" /> <span data-acc="Stochastic frontier (time-dependent inefficiency spread)" data-cost="Stochastic cost frontier (time-dependent inefficiency spread)">Stochastic frontier (time-dependent inefficiency spread)</span></label>
        </div>

        <div class="control-group">
          <div class="group-label">Order</div>
          <label><input type="radio" name="order" value="lin" checked /> Linear</label>
          <label><input type="radio" name="order" value="quad" /> Quadratic</label>
          <label><input type="radio" name="order" value="bc" /> Box-Cox</label>
        </div>

        <!-- 3-D: interactive WebGL surfaces (plot_surfaces_3d.R) -- the
             empirical staircase/record surface with the fitted surface
             overlaid. Heatmap: the same fitted surface seen from directly
             above, as a static faceted figure. Both are built for the
             frontier-per-se models only: the Pareto-grid logit and its
             envelope-constrained variant, in both directions and all three
             orders. -->
        <div class="control-group">
          <div class="group-label">Rendering</div>
          <label><input type="radio" name="rendering" value="2d" checked /> 2-D</label>
          <label><input type="radio" name="rendering" value="3d" /> 3-D (interactive)</label>
          <label><input type="radio" name="rendering" value="heatmap" /> Heatmap</label>
        </div>
      </div>

      <div class="plot-container">
        <img id="plot" src="" alt="Selected plot" />
        <iframe id="plot3d" title="Selected 3-D surface"></iframe>
        <div class="filename" id="filename"></div>
      </div>
    </div>

    <script>
      function getRadioValue(name) {
        const checked = document.querySelector(`input[name="${name}"]:checked`);
        return checked ? checked.value : "";
      }

      // Cost-direction file keys, per accuracy-direction model value. Cost
      // figures are <key>_<order>.png / isoaccuracy_<key>_<order>.png
      // (plot_cost_frontier.R) -- own-script naming, like envelope and
      // paretologit in the accuracy direction.
      const COST_KEY = {
        paretologit: "costgridols",
        paretologitenv: "costgridolsenv",
        S: "costols",
        A: "costsfa",
        B: "costsfab",
      };

      // Every view but the frontier one prefixes the model key with its own
      // name; the frontier view keeps each script's historical naming.
      const VIEW_PREFIX = {
        isoaccuracy: "isoaccuracy",
        isocost: "isocost",
      };

      function buildFilename() {
        const model = getRadioValue("model");
        const order = getRadioValue("order");
        const plotType = getRadioValue("plotType");
        const prefix = VIEW_PREFIX[plotType];

        if (getRadioValue("direction") === "cost") {
          const key = COST_KEY[model];
          return prefix ? `${prefix}_${key}_${order}.png` : `${key}_${order}.png`;
        }

        if (prefix) return `${prefix}_${model}_${order}.png`;

        // Frontier view: the Pareto-point logit and its envelope-constrained
        // variant have their own fitting scripts and are named
        // <model>_<order>.png; the SFA grid follows
        // frontier_progression_<family>_<order>.png.
        return ["paretologit", "paretologitenv"].includes(model)
          ? `${model}_${order}.png`
          : `frontier_progression_${model}_${order}.png`;
      }

      // Rename each model radio to its dual when the cost direction is
      // chosen; every order exists in both directions.
      function syncDirection() {
        const cost = getRadioValue("direction") === "cost";
        document.querySelectorAll('span[data-acc]').forEach((el) => {
          el.textContent = cost ? el.dataset.cost : el.dataset.acc;
        });
      }

      function update() {
        syncDirection();
        const img = document.getElementById("plot");
        const frame = document.getElementById("plot3d");
        const label = document.getElementById("filename");
        const model = getRadioValue("model");

        const rendering = getRadioValue("rendering");

        // Decline-rate surfaces exist only as 3-D pages and heatmaps: the
        // quantity is a whole surface over (accuracy, date), and the 2-D
        // curve-figure set has no counterpart for it.
        if (getRadioValue("plotType") === "decline" && rendering === "2d") {
          img.style.display = "none";
          frame.style.display = "none";
          label.innerHTML =
            '<span class="missing">Cost-decline surfaces exist as 3-D pages and heatmaps; switch Rendering.</span>';
          return;
        }

        // The isocost plate is a remapping of a surface the other views
        // already render in 3-D, so no 3-D page is built for it.
        if (getRadioValue("plotType") === "isocost" && rendering !== "2d") {
          img.style.display = "none";
          frame.style.display = "none";
          label.innerHTML =
            '<span class="missing">The isocost view is 2-D only; its surface is rendered in 3-D under the other views.</span>';
          return;
        }

        // 3-D pages and their heatmap twins exist for the frontier-per-se
        // models (the Pareto-grid pair, both directions) -- see
        // plot_surfaces_3d.R
        if (rendering !== "2d" &&
            !["paretologit", "paretologitenv"].includes(model)) {
          img.style.display = "none";
          frame.style.display = "none";
          label.innerHTML =
            '<span class="missing">3-D renderings and heatmaps are built for the Pareto-grid models only.</span>';
          return;
        }

        if (rendering === "3d") {
          img.style.display = "none";
          const key = getRadioValue("direction") === "cost" ? COST_KEY[model] : model;
          const filename = `surface3d_${key}_${getRadioValue("order")}_${getRadioValue("plotType")}.html`;
          frame.style.display = "block";
          frame.src = `../output/${filename}`;
          // no onerror equivalent for a missing iframe target (foreign
          // origin), so the filename is shown plainly, as in the table viewer
          label.textContent = filename;
          return;
        }

        frame.style.display = "none";
        let filename;
        if (rendering === "heatmap") {
          const key = getRadioValue("direction") === "cost" ? COST_KEY[model] : model;
          filename = `heatmap_${key}_${getRadioValue("order")}_${getRadioValue("plotType")}.png`;
        } else {
          filename = buildFilename();
        }
        const src = `../output/${filename}`;

        img.onerror = function () {
          img.style.display = "none";
          label.innerHTML = `<span class="missing">File not found: ${filename}</span>`;
        };

        img.onload = function () {
          img.style.display = "block";
          label.textContent = filename;
        };

        img.src = src;
      }

      document.querySelectorAll('input[type="radio"]').forEach((radio) => {
        radio.addEventListener("change", update);
      });

      update();
    </script>
  </body>
</html>
