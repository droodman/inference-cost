<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inference Cost Plot Viewer</title>
    <style>
      /* One background for the whole page: #101014 is SURFACE in
         frontier_viz.R (dark experiment), the colour the PNGs themselves are
         painted on, so the plots sit on the page with no visible seam and no
         framing chrome. If DARK is turned off there, restore --bg #fcfcfb,
         --text #1d1d1d, --muted #5e5e5e, --missing #a22020 here. */
      :root {
        --bg: #101014;
        --text: #f2f1ec;
        --muted: #8f8e88;
        --missing: #ff8f85;
      }

      * { box-sizing: border-box; }

      body {
        margin: 10px 12px;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Arial, sans-serif;
      }

      h1 {
        margin: 0 0 10px 0;
        font-size: 1.25em;
        font-weight: 700;
      }

      .layout {
        display: flex;
        gap: 14px;
        align-items: flex-start;
      }

      /* Fixed width, not min-width: a flex item's automatic minimum is its
         CONTENT width, so with min-width the longest Model label set the
         column's width and refused to wrap. Pinning the width is what makes
         long labels wrap instead of widening the selector. */
      .controls {
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: 180px;
        flex-shrink: 0;
        position: sticky;
        top: 10px;
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .group-label {
        font-size: 0.8em;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      /* flex-start, not center: with wrapped two-line labels the radio should
         sit beside the first line, not float between them */
      .control-group label {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        cursor: pointer;
        font-size: 0.9em;
        line-height: 1.25;
        color: var(--text);
      }

      .control-group input[type="radio"] {
        margin: 2px 0 0 0;
        flex-shrink: 0;
      }

      .plot-container {
        flex: 1;
        min-width: 0;
      }

      /* Full width of the remaining space, but never past the PNG's native
         2000px (10in at 200dpi) -- upscaling would blur exactly the legibility
         this layout is buying. */
      #plot {
        display: block;
        width: 100%;
        max-width: 2000px;
        height: auto;
      }

      .filename {
        margin-top: 4px;
        font-size: 0.86em;
        color: var(--muted);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      }

      .missing {
        color: var(--missing);
        font-style: italic;
        padding: 12px 0;
      }

      @media (max-width: 900px) {
        .layout {
          flex-direction: column;
        }

        .controls {
          position: static;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <h1>Inference Cost Plot Viewer</h1>

    <div class="layout">
      <div class="controls">
        <!-- Which variable the fit models directly. The cost direction shows
             the DUAL of each accuracy-direction model (plot_cost_frontier.R):
             same frontier object where one exists, misfit priced in log
             dollars instead of logits. Model labels swap to the duals' names;
             all three orders exist in both directions. -->
        <div class="control-group">
          <div class="group-label">Modeled variable</div>
          <label><input type="radio" name="direction" value="acc" checked /> Accuracy</label>
          <label><input type="radio" name="direction" value="cost" /> Cost</label>
        </div>

        <div class="control-group">
          <div class="group-label">Model</div>
          <label><input type="radio" name="model" value="paretologit" checked autocomplete="off"/> <span data-acc="Logistic, Pareto points" data-cost="Least squares, Pareto grid">Logistic, Pareto points</span></label>
          <label><input type="radio" name="model" value="envelope" /> <span data-acc="Strict logistic envelope" data-cost="Strict cost envelope">Strict logistic envelope</span></label>
          <label><input type="radio" name="model" value="S" /> <span data-acc="Logistic, all points" data-cost="Least squares, all points">Logistic, all points</span></label>
          <label><input type="radio" name="model" value="A"/> <span data-acc="Stochastic frontier" data-cost="Stochastic cost frontier">Stochastic frontier</span></label>
          <label><input type="radio" name="model" value="B" /> <span data-acc="Stochastic frontier (time-dependent inefficiency spread)" data-cost="Stochastic cost frontier (time-dependent inefficiency spread)">Stochastic frontier (time-dependent inefficiency spread)</span></label>
        </div>

        <div class="control-group">
          <div class="group-label">Order</div>
          <label><input type="radio" name="order" value="lin" checked /> Linear</label>
          <label><input type="radio" name="order" value="quad" /> Quadratic</label>
          <label><input type="radio" name="order" value="bc" /> Box-Cox</label>
        </div>

        <div class="control-group">
          <div class="group-label">Display</div>
          <label><input type="radio" name="plotType" value="frontier" checked /> Quarterly frontiers</label>
          <label><input type="radio" name="plotType" value="isoaccuracy" /> Iso-accuracy</label>
        </div>
      </div>

      <div class="plot-container">
        <img id="plot" src="" alt="Selected plot" />
        <div class="filename" id="filename"></div>
      </div>
    </div>

    <script>
      function getRadioValue(name) {
        const checked = document.querySelector(`input[name="${name}"]:checked`);
        return checked ? checked.value : "";
      }

      // Cost-direction file keys, per accuracy-direction model value. Cost
      // figures are <key>_<order>.png / isoaccuracy_<key>_<order>.png
      // (plot_cost_frontier.R) -- own-script naming, like envelope and
      // paretologit in the accuracy direction.
      const COST_KEY = {
        paretologit: "costgridols",
        envelope: "costenvelope",
        S: "costols",
        A: "costsfa",
        B: "costsfab",
      };

      function buildFilename() {
        const model = getRadioValue("model");
        const order = getRadioValue("order");
        const plotType = getRadioValue("plotType");

        if (getRadioValue("direction") === "cost") {
          const key = COST_KEY[model];
          return plotType === "frontier"
            ? `${key}_${order}.png`
            : `isoaccuracy_${key}_${order}.png`;
        }

        // Models with their own fitting script (envelope, Pareto-point logit)
        // are named <model>_<order>.png rather than following the SFA grid's
        // frontier_progression_<family>_<order>.png pattern.
        if (model === "envelope" || model === "paretologit") {
          if (plotType === "frontier") {
            return `${model}_${order}.png`;
          }
          return `isoaccuracy_${model}_${order}.png`;
        }

        if (plotType === "frontier") {
          return `frontier_progression_${model}_${order}.png`;
        }

        return `isoaccuracy_${model}_${order}.png`;
      }

      // Rename each model radio to its dual when the cost direction is
      // chosen; every order exists in both directions.
      function syncDirection() {
        const cost = getRadioValue("direction") === "cost";
        document.querySelectorAll('span[data-acc]').forEach((el) => {
          el.textContent = cost ? el.dataset.cost : el.dataset.acc;
        });
      }

      function update() {
        syncDirection();
        const filename = buildFilename();
        const img = document.getElementById("plot");
        const label = document.getElementById("filename");
        const src = `../output/${filename}`;

        img.onerror = function () {
          img.style.display = "none";
          label.innerHTML = `<span class="missing">File not found: ${filename}</span>`;
        };

        img.onload = function () {
          img.style.display = "block";
          label.textContent = filename;
        };

        img.src = src;
      }

      document.querySelectorAll('input[type="radio"]').forEach((radio) => {
        radio.addEventListener("change", update);
      });

      update();
    </script>
  </body>
</html>
