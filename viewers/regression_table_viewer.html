<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inference Cost Regression Tables</title>
    <style>
      /* Same palette and chrome as frontier_plot_viewer.html, so the two read as
         one pair of tools rather than two separate pages. */
      :root {
        --bg: #f5f5f3;
        --panel: #ffffff;
        --text: #1d1d1d;
        --muted: #5e5e5e;
        --border: #d9d9d5;
        --accent: #2c5d9a;
        --missing: #a22020;
      }

      * { box-sizing: border-box; }

      body {
        margin: 20px;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Arial, sans-serif;
      }

      h1 {
        margin: 0 0 16px 0;
        font-size: 1.5em;
        font-weight: 700;
      }

      .layout {
        display: flex;
        gap: 20px;
        align-items: flex-start;
      }

      .controls {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 220px;
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
        position: sticky;
        top: 20px;
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .group-label {
        font-size: 0.8em;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .control-group label {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        font-size: 0.96em;
        color: var(--text);
      }

      .control-group input[type="radio"] {
        margin: 0;
      }

      .table-container {
        flex: 1;
        min-width: 0;
      }

      /* Like .plot-frame, but the frame holds a document rather than an image,
         so no padding and no centring -- the table page supplies its own. */
      .table-frame {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        min-height: 600px;
      }

      /* The tables are 9 columns wide and up to 20 rows tall, so the frame is
         given a tall fixed height and the table page scrolls inside it. Height
         cannot be measured from here: a file:// iframe is a foreign origin in
         Chrome, so contentDocument is unreadable and auto-sizing would fail
         silently on exactly the setup this viewer is opened from. */
      #table {
        display: block;
        width: 100%;
        height: 78vh;
        min-height: 600px;
        border: 0;
        background: #fff;
      }

      .filename {
        margin-top: 8px;
        font-size: 0.86em;
        color: var(--muted);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      }

      .missing {
        color: var(--missing);
        font-style: italic;
        padding: 12px 0;
      }

      @media (max-width: 900px) {
        .layout {
          flex-direction: column;
        }

        .controls {
          position: static;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <h1>Inference Cost Regression Tables</h1>

    <div class="layout">
      <div class="controls">
        <!-- Same options, same order, same default as the Model group in
             frontier_plot_viewer.html. Kept in sync by hand; if one changes the
             other should follow. -->
        <div class="control-group">
          <div class="group-label">Model</div>
          <label><input type="radio" name="model" value="S" /> Logistic, all tests</label>
          <label><input type="radio" name="model" value="A" checked /> Stochastic frontier</label>
          <label><input type="radio" name="model" value="B" /> Stochastic frontier (time-dependent inefficiency spread)</label>
          <label><input type="radio" name="model" value="paretologit" /> Logistic, Pareto points</label>
          <label><input type="radio" name="model" value="envelope" /> Strict logistic envelope</label>
        </div>
      </div>

      <div class="table-container">
        <div class="table-frame">
          <iframe id="table" title="Selected regression table"></iframe>
        </div>
        <div class="filename" id="filename"></div>
      </div>
    </div>

    <script>
      function getRadioValue(name) {
        const checked = document.querySelector(`input[name="${name}"]:checked`);
        return checked ? checked.value : "";
      }

      function buildFilename() {
        return `regression_${getRadioValue("model")}.html`;
      }

      function update() {
        const filename = buildFilename();
        const frame = document.getElementById("table");
        const label = document.getElementById("filename");
        // No onerror equivalent for a missing iframe target: the browser renders
        // its own error page inside the frame and, being a foreign origin, that
        // page cannot be inspected from here. So the filename is shown plainly
        // rather than pretending to a check that would not fire.
        label.textContent = filename;
        frame.src = `../output/tables/${filename}`;
      }

      document.querySelectorAll('input[type="radio"]').forEach((radio) => {
        radio.addEventListener("change", update);
      });

      update();
    </script>
  </body>
</html>
