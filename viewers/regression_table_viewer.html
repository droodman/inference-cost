<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inference Cost Regression Tables</title>
    <style>
      /* Same palette and chrome as frontier_plot_viewer.html, so the two read as
         one pair of tools rather than two separate pages: one background
         (#fcfcfb, the figures' own surface colour, also painted by the table
         pages), no borders, a narrow fixed-width selector. */
      :root {
        --bg: #fcfcfb;
        --text: #1d1d1d;
        --muted: #5e5e5e;
        --missing: #a22020;
      }

      * { box-sizing: border-box; }

      body {
        margin: 10px 12px;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Arial, sans-serif;
      }

      h1 {
        margin: 0 0 10px 0;
        font-size: 1.25em;
        font-weight: 700;
      }

      .layout {
        display: flex;
        gap: 14px;
        align-items: flex-start;
      }

      /* Fixed width, not min-width: a flex item's automatic minimum is its
         CONTENT width, so with min-width the longest Model label set the
         column's width and refused to wrap. Pinning the width is what makes
         long labels wrap instead of widening the selector. */
      .controls {
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: 180px;
        flex-shrink: 0;
        position: sticky;
        top: 10px;
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .group-label {
        font-size: 0.8em;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      /* flex-start, not center: with wrapped two-line labels the radio should
         sit beside the first line, not float between them */
      .control-group label {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        cursor: pointer;
        font-size: 0.9em;
        line-height: 1.25;
        color: var(--text);
      }

      .control-group input[type="radio"] {
        margin: 2px 0 0 0;
        flex-shrink: 0;
      }

      .table-container {
        flex: 1;
        min-width: 0;
      }

      /* The tables are 9 columns wide and up to 20 rows tall, so the frame is
         given a tall fixed height and the table page scrolls inside it. Height
         cannot be measured from here: a file:// iframe is a foreign origin in
         Chrome, so contentDocument is unreadable and auto-sizing would fail
         silently on exactly the setup this viewer is opened from. */
      #table {
        display: block;
        width: 100%;
        height: 86vh;
        min-height: 600px;
        border: 0;
        background: var(--bg);
      }

      .filename {
        margin-top: 4px;
        font-size: 0.86em;
        color: var(--muted);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      }

      .missing {
        color: var(--missing);
        font-style: italic;
        padding: 12px 0;
      }

      @media (max-width: 900px) {
        .layout {
          flex-direction: column;
        }

        .controls {
          position: static;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <h1>Inference Cost Regression Tables</h1>

    <div class="layout">
      <div class="controls">
        <!-- Same options, same order, same default as the corresponding groups
             in frontier_plot_viewer.html. Kept in sync by hand; if one changes
             the other should follow. -->
        <div class="control-group">
          <div class="group-label">Modeled variable</div>
          <label><input type="radio" name="direction" value="acc" checked /> Accuracy</label>
          <label><input type="radio" name="direction" value="cost" /> Cost</label>
        </div>

        <div class="control-group">
          <div class="group-label">Model</div>
          <label><input type="radio" name="model" value="paretologit" checked  autocomplete="off" /> <span data-acc="Logistic, Pareto points" data-cost="Least squares, Pareto grid">Logistic, Pareto points</span></label>
          <label><input type="radio" name="model" value="envelope" /> <span data-acc="Strict logistic envelope" data-cost="Strict cost envelope">Strict logistic envelope</span></label>
          <label><input type="radio" name="model" value="S" /> <span data-acc="Logistic, all points" data-cost="Least squares, all points">Logistic, all points</span></label>
          <label><input type="radio" name="model" value="A"/> <span data-acc="Stochastic frontier" data-cost="Stochastic cost frontier">Stochastic frontier</span></label>
          <label><input type="radio" name="model" value="B" /> <span data-acc="Stochastic frontier (time-dependent inefficiency spread)" data-cost="Stochastic cost frontier (time-dependent inefficiency spread)">Stochastic frontier (time-dependent inefficiency spread)</span></label>
        </div>

        <!-- One table per specification (regression_<key>_<order>.html): a
             combined table stopped fitting the page once the benchmark count
             grew. Same options as the plot viewer's Order group. -->
        <div class="control-group">
          <div class="group-label">Order</div>
          <label><input type="radio" name="order" value="lin" checked /> Linear</label>
          <label><input type="radio" name="order" value="quad" /> Quadratic</label>
          <label><input type="radio" name="order" value="bc" /> Box-Cox</label>
        </div>
      </div>

      <div class="table-container">
        <iframe id="table" title="Selected regression table"></iframe>
        <div class="filename" id="filename"></div>
      </div>
    </div>

    <script>
      function getRadioValue(name) {
        const checked = document.querySelector(`input[name="${name}"]:checked`);
        return checked ? checked.value : "";
      }

      // Cost-direction table keys, per accuracy-direction model value --
      // regression_<key>.html, from the COST_KEYS block of regression_tables.R
      const COST_KEY = {
        paretologit: "costgridols",
        envelope: "costenvelope",
        S: "costols",
        A: "costsfa",
        B: "costsfab",
      };

      function buildFilename() {
        const model = getRadioValue("model");
        const key = getRadioValue("direction") === "cost" ? COST_KEY[model] : model;
        return `regression_${key}_${getRadioValue("order")}.html`;
      }

      // Rename each model radio to its dual when the cost direction is chosen,
      // exactly as frontier_plot_viewer.html does.
      function syncDirection() {
        const cost = getRadioValue("direction") === "cost";
        document.querySelectorAll("span[data-acc]").forEach((el) => {
          el.textContent = cost ? el.dataset.cost : el.dataset.acc;
        });
      }

      function update() {
        syncDirection();
        const filename = buildFilename();
        const frame = document.getElementById("table");
        const label = document.getElementById("filename");
        // No onerror equivalent for a missing iframe target: the browser renders
        // its own error page inside the frame and, being a foreign origin, that
        // page cannot be inspected from here. So the filename is shown plainly
        // rather than pretending to a check that would not fire.
        label.textContent = filename;
        frame.src = `../output/tables/${filename}`;
      }

      document.querySelectorAll('input[type="radio"]').forEach((radio) => {
        radio.addEventListener("change", update);
      });

      update();
    </script>
  </body>
</html>
